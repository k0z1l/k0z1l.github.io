<script>
(function() {
  try {
    var COLOR_THEME_KEY = "k0z1l_color_theme_v2";
    var savedTheme = localStorage.getItem(COLOR_THEME_KEY) || "ruby";
    if (savedTheme !== "cyan") {
      document.documentElement.classList.add("theme-ruby");
    } else {
      document.documentElement.classList.remove("theme-ruby");
    }
    document.documentElement.classList.add("dark");
  } catch(e) {}
})();
</script>
