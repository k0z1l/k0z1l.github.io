<div class="w-full max-w-2xl mx-auto my-6 font-mono text-sm">
  <div class="rounded-xl overflow-hidden shadow-2xl border border-neutral-700/80 bg-[#0c1017] dark:bg-[#070b11]">
    <!-- Terminal Titlebar -->
    <div class="flex items-center px-4 py-2.5 bg-[#161b22] border-b border-neutral-800 select-none">
      <div class="flex space-x-2">
        <span class="w-3 h-3 rounded-full bg-[#ff5f56] inline-block"></span>
        <span class="w-3 h-3 rounded-full bg-[#ffbd2e] inline-block"></span>
        <span class="w-3 h-3 rounded-full bg-[#27c93f] inline-block"></span>
      </div>
      <div class="flex-1 text-center text-xs text-neutral-400 font-medium">
        khv1ch4rs@cyber-box:~ (bash)
      </div>
      <div class="w-10"></div>
    </div>
    <!-- Terminal Body -->
    <div class="p-5 text-left text-neutral-200 leading-relaxed min-h-[120px]">
      <div class="text-neutral-400 mb-2">
        <span class="text-emerald-400 font-bold">khv1ch4rs@security</span>:<span class="text-blue-400 font-bold">~</span>$ <span class="text-neutral-100 font-semibold">./motd.sh</span>
      </div>
      <div id="terminal-typewriter" class="text-emerald-400 font-medium whitespace-pre-wrap"></div>
      <noscript>
        <div class="text-emerald-400 font-medium">
          Study With Khv1ch4rs<br>
          🍀Welcome to my blog! Grab a cup of coffee and enjoy the reads.🍀
        </div>
      </noscript>
    </div>
  </div>
</div>

<script>
  (function () {
    const textLines = [
      "Study With Khv1ch4rs",
      "🍀Welcome to my blog! Grab a cup of coffee and enjoy the reads.🍀"
    ];
    const target = document.getElementById("terminal-typewriter");
    if (!target) return;

    let lineIdx = 0;
    let charIdx = 0;

    function typeChar() {
      if (lineIdx < textLines.length) {
        if (charIdx === 0 && lineIdx > 0) {
          target.innerHTML += "<br>";
        }
        if (charIdx < textLines[lineIdx].length) {
          target.innerHTML += textLines[lineIdx].charAt(charIdx);
          charIdx++;
          setTimeout(typeChar, 35);
        } else {
          lineIdx++;
          charIdx = 0;
          setTimeout(typeChar, 300);
        }
      } else {
        target.innerHTML += '<span class="inline-block w-2 h-4 ms-1 bg-emerald-400 animate-pulse align-middle"></span>';
      }
    }

    setTimeout(typeChar, 400);
  })();
</script>
