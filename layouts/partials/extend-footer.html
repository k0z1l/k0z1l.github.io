<!-- ==========================================================================
     k0z1l Bilingual Instant 1-Click Translator (English / Vietnamese)
     ========================================================================== -->
<div id="google_translate_element" style="display:none;" class="notranslate" translate="no"></div>

<script>
(function() {
  const STORAGE_KEY = "k0z1l_site_lang";

  function setTransCookie(targetLang) {
    const host = window.location.hostname;
    const exp = "expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
    document.cookie = "googtrans=; " + exp;
    if (host && host !== "localhost") {
      document.cookie = "googtrans=; " + exp + " domain=" + host + ";";
      const parts = host.split(".");
      if (parts.length > 1) {
        const rootDomain = "." + parts.slice(-2).join(".");
        document.cookie = "googtrans=; " + exp + " domain=" + rootDomain + ";";
      }
    }

    const primary = "/auto/" + targetLang;
    document.cookie = "googtrans=" + primary + "; path=/;";
    if (host && host !== "localhost") {
      document.cookie = "googtrans=" + primary + "; path=/; domain=" + host + ";";
      const parts = host.split(".");
      if (parts.length > 1) {
        const rootDomain = "." + parts.slice(-2).join(".");
        document.cookie = "googtrans=" + primary + "; path=/; domain=" + rootDomain + ";";
      }
    }
  }

  function protectElements() {
    const targets = document.querySelectorAll(
      'pre, code, .highlight, .terminal-window, #cmd-typing, #motd-output, .show-more-glow-btn, header nav, .main-menu, .mobile-header-row, #mobile-menu-dialog, .lang-switcher-wrap, [translate="no"], .notranslate'
    );
    targets.forEach(el => {
      el.classList.add("notranslate");
      el.setAttribute("translate", "no");
    });
  }

  function updateUI(lang) {
    document.querySelectorAll(".lang-btn").forEach(btn => {
      if (btn.getAttribute("data-lang") === lang) {
        btn.classList.add("active");
      } else {
        btn.classList.remove("active");
      }
    });
  }

  function applyLanguageToCombo(lang) {
    let attempts = 0;
    const timer = setInterval(() => {
      attempts++;
      const combo = document.querySelector(".goog-te-combo");
      if (combo) {
        if (combo.value !== lang) {
          combo.value = lang;
          combo.dispatchEvent(new Event("change"));
        }
        clearInterval(timer);
      }
      if (attempts > 50) clearInterval(timer);
    }, 100);
  }

  window.k0z1lSwitchLanguage = function(targetLang) {
    localStorage.setItem(STORAGE_KEY, targetLang);
    updateUI(targetLang);
    setTransCookie(targetLang);

    const combo = document.querySelector(".goog-te-combo");
    if (combo) {
      combo.value = targetLang;
      combo.dispatchEvent(new Event("change"));
    } else {
      window.location.reload();
    }
  };

  let activeLang = localStorage.getItem(STORAGE_KEY);
  if (!activeLang) {
    activeLang = "en"; // Default is English
    localStorage.setItem(STORAGE_KEY, "en");
  }
  setTransCookie(activeLang);

  function bindButtons() {
    updateUI(activeLang);
    document.querySelectorAll(".lang-btn").forEach(btn => {
      btn.onclick = function(e) {
        e.preventDefault();
        const target = this.getAttribute("data-lang");
        window.k0z1lSwitchLanguage(target);
      };
    });
  }

  protectElements();
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", () => {
      protectElements();
      bindButtons();
      applyLanguageToCombo(activeLang);
    });
  } else {
    bindButtons();
    applyLanguageToCombo(activeLang);
  }

  window.googleTranslateElementInit = function() {
    new google.translate.TranslateElement({
      pageLanguage: "auto",
      includedLanguages: "en,vi",
      autoDisplay: false
    }, "google_translate_element");
    applyLanguageToCombo(activeLang);
  };
})();

<!-- ==========================================================================
     Cyber Theme Switcher: Cyan Jade (Xanh Ngọc) ⮂ Ruby Red (Đỏ Ngọc)
     ========================================================================== -->
<script>
(function() {
  const COLOR_THEME_KEY = "k0z1l_color_theme";

  // Always force dark mode class on root so Blowfish light-mode black text is never triggered
  document.documentElement.classList.add("dark");

  function applyColorTheme(theme) {
    if (theme === "ruby") {
      document.documentElement.classList.add("theme-ruby");
    } else {
      document.documentElement.classList.remove("theme-ruby");
    }
  }

  // Load saved theme (default to cyan)
  let savedTheme = localStorage.getItem(COLOR_THEME_KEY) || "cyan";
  applyColorTheme(savedTheme);

  function bindThemeSwitcher() {
    document.documentElement.classList.add("dark");

    const buttons = document.querySelectorAll("#cyber-theme-switcher, #cyber-theme-switcher-mobile");
    buttons.forEach(btn => {
      btn.onclick = function(e) {
        e.preventDefault();
        e.stopPropagation();
        const isRuby = document.documentElement.classList.contains("theme-ruby");
        const nextTheme = isRuby ? "cyan" : "ruby";
        localStorage.setItem(COLOR_THEME_KEY, nextTheme);
        applyColorTheme(nextTheme);
      };
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", bindThemeSwitcher);
  } else {
    bindThemeSwitcher();
  }

  // Guard against Blowfish appearance switcher or any external script stripping dark class
  const observer = new MutationObserver(() => {
    if (!document.documentElement.classList.contains("dark")) {
      document.documentElement.classList.add("dark");
    }
  });
  observer.observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });
})();
</script>
